  <h2>La pérdida de la identidad de Iván Karamázov</h2> 
	<i><p>Disclaimer: Estudio Matemáticas, no he entrado en una facultad de humanidades en mi vida. Lo que escribo me fue revelado en paseos por mi pueblo. No esperes citación Chicago ni cohesión y ritmo académicos. Disfruta este hurgamiento en mis impulsos…  </p></i>
  <p style="text-align: justify;">Tolstói dice, refieriéndose a Dostoievski, que se trata de «un individuo en quien todo es lucha». Los héroes dostoievskianos se levantan contra la creación entera, de una forma torpe, individiualista, carente de base, fundada en motivos dudosos y destinada a la flagelación. Dirigen su ceño torvo al sórdido mundo, que deriva en la sublevación contra Dios. Sometidos a esta tensión, desorientados por la sensación de fracaso moral universal, destruyen y se destruyen (¿Qué otra cosa hacer en un mundo desquiciado?). Pero son demasiado sensibles; se activa su conciencia, y las ideas racionales que les llevaron a cometer el crimen vacilan una vez éste es perpetrado. Se desmorona el nihilismo en el que se habían introducido de lleno, y en este contexto, ya no saben si percibirse como pecadores o salvadores. Pero, bajo una religión cuya luz aparece ambigua, ¿qué significa ser un pecador?  Quizá no hay pecadores ni salvadores, o lo son y no lo son simultáneamente. Y he aquí el leitmotiv de la última obra de Dostoievski: la impasible contradicción. El edificio moral y espiritual se derrumba; por tanto, no se debería disponer de un contexto válido donde se abra paso la paradoja (¡gozamos de plena libertad para construir axiomas consistentes!), y aun así ésta emerge de entre las ruinas como único carácter definitorio de la condición humana. No es sorprendente que no haya un solo héroe dostoievskiano que no aparezca desgarrado. </p>
  <p style="text-align: justify;">Pero hay un personaje del escritor ruso cuya contusión será objeto de galimatías en este desmañado ensayo: el vástago mediano del vil y despreciable Fiódor Pávolich, Iván Karamázov. El joven estudiante es el resultado del espíritu del siglo XIX: del escepticismo frente a las pretensiones dogmáticas e idealistas, nace su complejidad y tensión internas y se forma así una amalgama de resignaciones desordenadas. A pesar de que la reforma protestante no llegó a Rusia, la imponderable revolución europea del pensamiento hizo vibrar los confines intelectuales del país zarista. Desde la duda metódica cartesiana hasta la muerte de Dios diagnosticada por Nietzsche, pasando por los límites kantianos de la razón pura, Europa se vio convertida en un campo de liza donde la velocidad de mutación de lo que se conocía como arte, ciencia y filosofía convergió en una colisión traumática: de estos entresijos nació el progreso, centauro hidrocefálico que llenaba las bocas de los intelectuales rusos. En esta caótica sinfonía, el escepticismo y el dogmatismo chocaban, se confundían, se retorcían y tiraban el uno del otro ¡Y toda esta confusión congregóse en el sensible mundo imaginario de los jóvenes universitarios de una Rusia putrefacta que, para colmo, debería recibir este progreso de una embestida!. No debe escandalizarnos, pues, que cuando Iván, un chaval taciturno, se dispone a darse a conocer a su hermano menor, Aliosha, le confiesa:</p>
  <p style="text-align: justify;">«…si Dios existe y si, en efecto, creó la tierra, esto lo hizo, según sabemos perfectamente, de conformidad con la geometría euclidiana, y la inteligencia humana la creó con sólo la noción de las tres dimensiones del espacio. Mientras tanto, ha habido y hay geómetras y filósofos, incluso de los más famosos, que ponen en duda el hecho de que todo el universo, o más ampliamente, todo el ser, fuera creado con arreglo únicamente a la geometría euclidiana; se atreven incluso a pensar que dos líneas paralelas, que según Euclides no pueden encontrarse nunca en la tierra, acaso lleguen a encontrarse en algún punto de la infinitud. Yo, querido, he decidido que si ni siquiera esto lo puedo comprender, mucho menos podría comprender a Dios. Reconozco humildemente que carezco de capacidad para resolver tales problemas, mi mente es euclidiana, terrenal, y por eso no estamos en condiciones de resolver lo que no pertenece a este mundo»
</p>
  <p style="text-align: justify;">Iván parece iniciar su enfrentamiento con el cristianismo de una forma pacífica. Acepta el misterio, y con él la posibilidad de la existencia de Dios. Y de repente, sin previo aviso, todo se levanta (¡y se precipita!, pero de ninguna manera se mantiene estable).
</p>
  <p style="text-align: justify;">«Así, pues, acepto a Dios de buen grado; más todavía, acepto su sabiduría y su finalidad como algo que no conocemos en absoluto; creo en el orden, en el sentido de la vida, creo en la eterna armonía [...] Pues imagínate que no acepto el resultado definitivo de este mundo de Dios, aunque sé que existe, y no lo admito en absoluto. No es que niegue a Dios, compréndelo, lo que no acepto ni quiero aceptar es el mundo por él creado, el mundo de Dios. Una reserva: estoy convencido como un niño de que los sufrimientos acabarán por desaparecer, que toda la indignante farsa de las contradicciones humanas desaparecerá como un miserable espejismo, como una infame invención de la mente euclidiana del hombre; estoy convencido, en fin, de que en el final del mundo, en el momento de la armonía eterna, ocurrirá y surgirá algo tan precioso que bastará para redimir todas las maldades de los hombres [...] Admito, incluso, que las líneas paralelas llegarán a encontrarse y que esto lo veré yo mismo: lo veré y diré que se han juntado, pero, a pesar de todo, no lo aceptaré».</p>
  <p style="text-align: justify;">Nos encontramos ante alguien que se subleva contra la geometría no euclidiana, ¡y precisamente porque rechaza el mundo euclidiano! La creación divina –este mundo grotesco y cruel– es inaceptable; y cualquier verdad superior también. Aunque hubiera una justificación trascendental, aunque la existencia de Dios fuera una certeza, y la más bella de todas, Iván no la aceptaría «porque todo el mundo del conocimiento no merecería entonces estas lágrimas de la niña que implora a Dios». Si hay una verdad, es indignante; si hay un Dios, lo somete al juicio moral; si hay una salvación eterna, no vale la pena. La exacción divina es intolerable.</p>
   <p style="text-align: justify;">Pero ¿cuál es entonces, para Iván, el fundamento de la moral? Rechaza la inmortalidad, y con ello aborrece el juicio cristiano, impugna todo mandamiento impersonal sobre el bien y el mal, desaparece en él la creencia en la virtud, también, por tanto, en la ley moral: «Todo es lícito». He aquí el ya tan visto y aborrecible nihilista decimonónico. Es importante destacar que el nihilismo no es solo desesperación y negación, sino, sobre todo, voluntad de desesperar y negar. Iván se forzará a hacer el mal por coherencia. No se permitirá ser bueno. El mismo que niega a Dios en nombre de la justicia, opta por decir que la virtud no existe más que la inmortalidad. El mismo que no tolera el sufrimiento de un alma inocente, una vez rechaza el orden de Dios, reconoce la legitimidad del crimen. Siguiendo su lógica, permitirá que se asesine. Pero se volverá loco. El hombre que no entendía cómo se podía amar a su prójimo tampoco entiende cómo se le puede matar. Atrapado entre una virtud injustificable y un crimen inaceptable, devorado de piedad e incapaz de amar, solitario privado del caritativo cinismo, la contradicción matará esta inteligencia soberana.</p> 
   <p style="text-align: justify;">En ello consiste el grito profundo de Iván Karamázov, cuyo cuerpo no soporta la paradoja, que tira de dos sentidos a la vez, que afirma los dos sentidos a la vez: Iván, al mismo tiempo, rechaza el cielo por el prójimo y dice no entender a quien ama al prójimo; culpabiliza a los hombres, seres viles que robaron el fuego, y afirma rotundamente que no hay culpables; no tolera la pena de muerte y acepta el crimen; exige la reparación terrenal aquí y ahora, y la desprecia por construirse sobre la tragedia de seres inocentes; declara que no quiere comprender y suplica a su hermano respuestas: «dime, por favor, ¿qué tienen que ver los niños en todo esto?»; niega la virtud y necesita saberse inocente. Se encuentra atrapado en un puro devenir sin medida, en un devenir-loco que no se detiene jamás, y que avanza en los dos sentidos a la vez. Como Raskólnikov en Crimen y castigo, es incapaz de acabar este devenir, de no modularse incesantemente, de dejar paso a ser captado o fijado; en su corazón indócil no hay cabida para el acomodamiento. De este modo, la identidad de Iván se pierde, el sustantivo se diluye en verbos inconsistentes, en potencias impasibles (rechazar-necesitar, despreciar-amar). Quien había impugnado a Dios y al mundo, ahora ni siquiera puede aferrarse a un yo.  La contradicción, que va siempre en dos sentidos a la vez, descuartiza al sujeto en esta doble dirección. A Iván, el ateo, el escéptico, el ilustrado, se le aparece el diablo. «La paradoja –-dice Deleuze— es primeramente lo que destruye al buen sentido como sentido único, pero luego es lo que destruye al sentido común como asignación de identidades fijas».</p>
   <p style="text-align: justify;">En esta frase de Gilles Deleuze se condensa el proceso de desgarramiento por el que pasa Iván. Nuestro Karamázov se deja atravesar por la multiplicidad de contradicciones, por el «absurdo euclidiano». Pierde así el buen sentido, la ley cristiana, la virtud impuesta desde arriba; ahora «todo está permitido», dice él. Pero las vísceras imperan sobre aquello que la razón elude; su cuerpo cae enfermo, atrofiado por su necesidad de saberse inocente. Convertido en una masa indecisa, Iván se vuelve loco, y su identidad se ve descuartizada en dos partes: resta, por un lado, un joven enajenado y febril, que quiere vivir pero que cae asintóticamente en la culpa y el tormento; por el otro lado, el diablo. «Eres una alucinación mía. —dice Iván— Eres la encarnación de mi propia persona, aunque sólo de una parte… de mis ideas y sentimientos, de los más sucios y estúpidos».</p>
   <p style="text-align: justify;">Iván es alguien que ama; no deja de ser un Karamázov. «¿Amar la vida más que a su sentido?», le pregunta a Aliosha, su hermano menor, quien le responde afirmativamente. Ambos dejan que el sufrimiento del mundo, arrastrado por los verbos, se les clave dolorosamente, acaso se lo introducen ellos mismos en el cuerpo. «Se desea amar con los entresijos y las entrañas», entonan casi al unísono ambos hermanos, en medio de un doloroso seppuku que abre su organismo a las intensidades que vienen de través. Aliosha, continuando su contestación, dice sobre la vida: «Amarla más que a la lógica, como tú decías, que se halle siempre por delante de la lógica, y sólo entonces comprenderé el sentido». Asevera a Iván que ha logrado media hazaña, amar la vida, y que, en pos de su salvación, ha de procurarse la segunda mitad. Pero bien sabemos que Iván se pierde en el sendero del sentido. De los diferentes destinos de Aliosha e Iván se alza una cuestión: ¿Por qué el menor de los Karamázov se salva de la locura?</p>
   <p style="text-align: justify;">La respuesta la da el stárets Zósima, en sus enseñanzas: «La verdad es que pasamos por la tierra como a tientas, y, de no tener delante la preciosa imagen de Cristo, sucumbiríamos y nos perderíamos por completo». No debemos pensar que Aliosha no pasa por el proceso lacerante que describe Deleuze. La paradoja expulsa del cuerpo de Aliosha el buen sentido como sentido único. De no ser por ello, no se habría erigido como juez, y mucho menos habría condenado a muerte a quienes asesinan a los niños («¡Fusilarlos!», grita con una sonrisa crispada). La contradicción también destruye en Aliosha el sentido común como asignación de identidades. Se trata de que, a diferencia de Iván, Aliosha no necesita el sentido común, no busca la simplicidad del pensamiento. Nuestro joven y melancólico paladín, en su descenso del monasterio, mira a los ojos y con valentía a las quimeras de los desamparados. El cadáver de los santos también apesta, los niños juegan a matar criaturas, los celos se proclaman jinetes del cuerpo, la avaricia corrompe las almas nobles; Aliosha llega a desasirse del mundo. Pero en su ardiente plegaria, no pide a Dios que le aclare las dudas lacerantes, ansía únicamente «la ternura jubilosa».</p>
   <p style="text-align: justify;">«El Yo —dice Deleuze— no es primero y suficiente en el orden de la palabra sino en tanto que envuelve significaciones que deben ser desarrolladas por sí mismas». Si estas significaciones fundamentales —Dios y el mundo— se derrumban, la identidad personal es arrancada, experiencia dolorosa que sufre Iván, en condiciones en las que Dios y el mundo se vuelven indecisos, incoherentes, ininteligibles, inaceptables. El desplome del Yo no es otra cosa que una consecuencia necesaria de esta sucesión de caídas. A ambos hermanos se les hunde el mundo (el sentido común de que se sirven no es capaz de abarcar sin temblor la multiplicidad viva y horrísona que conforma el drama humano). A Iván se le cae también Dios, pero el efecto dominó se detiene en este punto para Aliosha, ya que su amor a Dios supera toda contradicción lógica.</p>
  <p style="text-align: justify;">Iván, aunque no tenga razón, no admite a su Dios; Aliosha, aunque no tenga razón, ama a su Dios, y por eso recupera el mundo perdido («besó la tierra, entre lágrimas, y juró amarla por toda la eternidad»), y por eso no cae en la locura. Así,  un pilar —Dios—ha resistido, y el otro —-el mundo— ha sido reconstruido. Por tanto, el Yo de Aliosha puede mantenerse, pues sus significaciones lo han hecho. La paradoja sale de su ser después de atravesarlo, y su fe permite su expulsión y evita toda demolición ¡estamos frente al parto de un sentido nuevo! No necesita la claridad del sentido común, por eso mismo ignora toda prueba que culpabilice a Dimitri Karamázov: Aliosha ha penetrado en su alma, y le basta con la pura intuición para saber que su hermano es inocente. Desertor del sentido común, encuentra uno mucho más poderoso, uno que deja que la paradoja se deslice a través, uno que abraza el extravío y el rechinar de dientes. Sabe que Iván, sumido en un abismo de amarga desesperación, se culpabiliza del crimen; no se lo ha dicho a nadie, ni siquiera lo ha sugerido, pero a Aliosha se le revela su daño anímico. Y es que Aliosha opera en otra dimensión, bajo el criterio de un sentido ignoto, que nace de la fractura.</p>
  <p style="text-align: justify;">—¡Hermano! —le gritó Aliosha a sus espaldas—. ¡Si algo te sucede hoy, piensa, lo primero de todo, en mí!</p>-->
